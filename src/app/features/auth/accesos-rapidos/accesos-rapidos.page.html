<ion-content class="accesos-rapidos-page">
  <div class="accesos-rapidos-shell">
    <div class="top-bar">
      <button class="btn-back" type="button" (click)="volver()" aria-label="Volver">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </button>
    </div>

    <div class="quick-list" role="list">
      @for (acceso of accesosRapidos; track acceso.email) {
        <button
          type="button"
          class="quick-item"
          (click)="accederRapido(acceso)"
          [disabled]="cargando()"
          aria-label="Entrar como {{ acceso.perfil }}"
        >
          <span class="quick-item__foto" aria-hidden="true">
            @if (fotos()[acceso.email]; as foto) {
              <img [src]="foto" alt="" />
            } @else {
              <span>{{ inicial(acceso) }}</span>
            }
          </span>

          <span class="quick-item__content">
            <span class="quick-item__label">{{ acceso.perfil.toUpperCase() }}</span>
            <span class="quick-item__description">{{ acceso.descripcion }}</span>
          </span>
          <span class="quick-item__arrow" aria-hidden="true">›</span>
        </button>
      }
    </div>

    <div class="quick-status">
      @if (cargando()) {
        <img src="assets/icon/logo.png" alt="" class="spinner-logo spinner-logo--grande" />
      }

      @if (errorLogin()) {
        <ion-text class="form-error" color="danger">
          <p>{{ errorLogin() }}</p>
        </ion-text>
      }
    </div>
  </div>
</ion-content>
