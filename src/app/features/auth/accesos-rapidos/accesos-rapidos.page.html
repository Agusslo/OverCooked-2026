<ion-content class="accesos-rapidos-page">
  <div class="accesos-rapidos-shell">
    <h1 class="accesos-rapidos-titulo">Accesos rápidos</h1>
    <p class="accesos-rapidos-subtitulo">Elegí un perfil para ingresar con un usuario de prueba.</p>

    <div class="quick-chip-list">
      @for (acceso of accesosRapidos; track acceso.email) {
        <ion-chip class="quick-chip" (click)="accederRapido(acceso)" [disabled]="cargando()">
          <ion-icon [name]="acceso.icono"></ion-icon>
          <ion-label>{{ acceso.perfil }}</ion-label>
        </ion-chip>
      }
    </div>

    @if (cargando()) {
      <ion-spinner name="crescent"></ion-spinner>
    }

    @if (errorLogin()) {
      <ion-text class="form-error" color="danger">
        <p>{{ errorLogin() }}</p>
      </ion-text>
    }
  </div>
</ion-content>
