<div class="juegos-shell">
  <div class="juegos-header">
    <button class="btn-back" type="button" (click)="volver()" aria-label="Volver">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
    </button>
    <div class="juegos-header__texto">
      <span class="juegos-header__rol">CLIENTE</span>
      <h1 class="juegos-header__titulo">Juegos</h1>
    </div>
  </div>

  <main class="juegos-cuerpo">
    @if (cargando()) {
      <div class="juegos-estado">
        <img src="assets/icon/logo.png" alt="" class="spinner-logo" />
        <span>Cargando…</span>
      </div>
    } @else {
      @if (mejorDescuento() > 0) {
        <div class="banner-descuento">
          <span>Mejor descuento conseguido</span>
          <strong>{{ mejorDescuento() }}%</strong>
        </div>
      }

      <div class="juegos-grid">
        @for (j of juegos; track j.juego) {
          <button
            type="button"
            class="juego-card"
            [class.juego-card--jugado]="yaJugado(j.juego)"
            [class.juego-card--proximamente]="!j.ruta"
            [disabled]="!j.ruta || yaJugado(j.juego)"
            (click)="jugar(j.ruta)"
          >
            <div class="juego-card__descuento">{{ j.descuentoPct }}%</div>
            <div class="juego-card__info">
              <strong class="juego-card__nombre">{{ j.nombre }}</strong>
              <span class="juego-card__subtitulo">
                @if (yaJugado(j.juego)) {
                  Ya jugado
                } @else if (!j.ruta) {
                  Próximamente
                } @else {
                  Ganá un descuento
                }
              </span>
            </div>
            @if (!yaJugado(j.juego) && j.ruta) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m9 18 6-6-6-6" />
              </svg>
            }
          </button>
        }
      </div>
    }
  </main>
</div>
