@if (esClienteOAnonimo) {
  <!-- Punto 12: el cliente ve la sala de espera / pedido, no el panel. -->
  <app-sala-espera />
} @else {
<ion-content class="inicio-page" [scrollY]="false">
  @if (usuario; as usuario) {
    <div class="inicio-shell">

      <!-- Encabezado común a todos los inicios -->
      <app-header-inicio [rol]="panel?.rol ?? usuario.perfil" />

      <!-- Cuerpo -->
      <div class="inicio-body">
        <div class="inicio-hero">
          <img class="inicio-hero__marca" src="assets/icon/logo.png" alt="OverCooked" />
        </div>

        @if (panel) {
          <nav class="inicio-acciones">
            @for (accion of panel.acciones; track accion.ruta) {
              <button type="button" class="inicio-card" [routerLink]="accion.ruta">
                <span class="inicio-card__icono">
                  @switch (accion.icono) {
                    @case ('empleado') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <line x1="19" x2="19" y1="8" y2="14" />
                        <line x1="22" x2="16" y1="11" y2="11" />
                      </svg>
                    }
                    @case ('cliente') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <polyline points="16 11 18 13 22 9" />
                      </svg>
                    }
                    @case ('mesas') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect width="7" height="7" x="3" y="3" rx="1" />
                        <rect width="7" height="7" x="14" y="3" rx="1" />
                        <rect width="7" height="7" x="14" y="14" rx="1" />
                        <rect width="7" height="7" x="3" y="14" rx="1" />
                      </svg>
                    }
                    @case ('mesa-nueva') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2" />
                        <path d="M12 8v8" />
                        <path d="M8 12h8" />
                      </svg>
                    }
                    @case ('asignar-mesa') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect width="7" height="7" x="3" y="3" rx="1" />
                        <circle cx="17.5" cy="6.5" r="3.5" />
                        <path d="M3 21v-2a4 4 0 0 1 4-4h1" />
                        <path d="m15.5 8.5 1.3 1.3 2.7-2.7" />
                      </svg>
                    }
                    @case ('escanear-mesa') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                        <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                        <rect width="10" height="10" x="7" y="7" rx="1" />
                      </svg>
                    }
                    @case ('plato') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
                        <path d="M7 2v20" />
                        <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
                      </svg>
                    }
                    @case ('bebida') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 22h8" />
                        <path d="M7 10h10" />
                        <path d="M12 15v7" />
                        <path d="M12 15 5 3h14l-7 12Z" />
                      </svg>
                    }
                    @case ('chat') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                      </svg>
                    }
                    @case ('lista-espera') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                      </svg>
                    }
                  }
                </span>

                <span class="inicio-card__texto">
                  <span class="inicio-card__titulo">{{ accion.titulo }}</span>
                  <span class="inicio-card__detalle">{{ accion.detalle }}</span>
                </span>

                <svg class="inicio-card__flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m9 18 6-6-6-6" />
                </svg>
              </button>
            }
          </nav>
        } @else {
          <p class="inicio-sin-panel">
            Todavía no hay accesos configurados para este perfil.
          </p>
        }
      </div>

    </div>
  }
</ion-content>
}
