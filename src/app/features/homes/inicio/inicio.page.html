<ion-content class="inicio-page" [scrollY]="false">
  @if (usuario; as usuario) {
    <div class="inicio-shell">

      <!-- Encabezado: avatar + rol + nombre + cerrar sesión -->
      <header class="inicio-header">
        <div class="inicio-avatar">
          @if (usuario.foto_url) {
            <img [src]="usuario.foto_url" alt="Foto de perfil de {{ usuario.nombre }}" />
          } @else {
            <span>{{ iniciales }}</span>
          }
        </div>

        <div class="inicio-identidad">
          <span class="inicio-rol">{{ panel?.rol ?? usuario.perfil }}</span>
          <span class="inicio-nombre">{{ usuario.nombre }} {{ usuario.apellido }}</span>
        </div>

        <button
          type="button"
          class="inicio-logout"
          (click)="cerrarSesion()"
          aria-label="Cerrar sesión"
        >
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
        </button>
      </header>

      <!-- Cuerpo -->
      <div class="inicio-body">
        <div class="inicio-hero">
          <img class="inicio-hero__marca" src="assets/icon/logo.png" alt="OverCooked" />
        </div>

        @if (panel) {
          <nav class="inicio-acciones">
            @for (accion of panel.acciones; track accion.ruta) {
              <button type="button" class="inicio-card" [routerLink]="accion.ruta">
                <span class="inicio-card__icono">
                  @switch (accion.icono) {
                    @case ('empleado') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <line x1="19" x2="19" y1="8" y2="14" />
                        <line x1="22" x2="16" y1="11" y2="11" />
                      </svg>
                    }
                    @case ('cliente') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <polyline points="16 11 18 13 22 9" />
                      </svg>
                    }
                    @case ('mesas') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect width="7" height="7" x="3" y="3" rx="1" />
                        <rect width="7" height="7" x="14" y="3" rx="1" />
                        <rect width="7" height="7" x="14" y="14" rx="1" />
                        <rect width="7" height="7" x="3" y="14" rx="1" />
                      </svg>
                    }
                    @case ('mesa-nueva') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2" />
                        <path d="M12 8v8" />
                        <path d="M8 12h8" />
                      </svg>
                    }
                    @case ('plato') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
                        <path d="M7 2v20" />
                        <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
                      </svg>
                    }
                    @case ('bebida') {
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 22h8" />
                        <path d="M7 10h10" />
                        <path d="M12 15v7" />
                        <path d="M12 15 5 3h14l-7 12Z" />
                      </svg>
                    }
                  }
                </span>

                <span class="inicio-card__texto">
                  <span class="inicio-card__titulo">{{ accion.titulo }}</span>
                  <span class="inicio-card__detalle">{{ accion.detalle }}</span>
                </span>

                <svg class="inicio-card__flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m9 18 6-6-6-6" />
                </svg>
              </button>
            }
          </nav>
        } @else {
          <p class="inicio-sin-panel">
            Todavía no hay accesos configurados para este perfil.
          </p>
        }
      </div>

    </div>
  }
</ion-content>
