<div class="consultas-page-wrapper">
  <div class="main-container">
    <div class="card-box">
      <div class="header-box">
        <h2>Consultas de mesas</h2>
        <p>Mesas ocupadas ahora mismo</p>
      </div>

      @if (cargando()) {
        <div class="estado-carga">
          <img src="assets/icon/logo.png" alt="" class="spinner-logo spinner-logo--grande" />
          <span>Cargando mesas...</span>
        </div>
      } @else if (mesas().length === 0) {
        <div class="estado-vacio">
          <span>No hay mesas ocupadas en este momento.</span>
        </div>
      } @else {
        <div class="mesas-lista">
          @for (mesa of mesas(); track mesa.id) {
            <button type="button" class="mesa-item" (click)="abrirMesa(mesa)">
              <span class="mesa-item__nombre">
                Mesa {{ mesa.numero }}
                @if (tieneNovedad(mesa)) {
                  <span class="punto-novedad" aria-label="Mensaje nuevo sin leer"></span>
                }
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m9 18 6-6-6-6" />
              </svg>
            </button>
          }
        </div>
      }

      @if (mensajeError()) {
        <div class="feedback-banner error">
          <span>{{ mensajeError() }}</span>
        </div>
      }
    </div>
  </div>
</div>
