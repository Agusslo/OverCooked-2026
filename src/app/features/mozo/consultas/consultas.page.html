<div class="consultas-page-wrapper">
  <div class="main-container">
    <div class="card-box">
      <div class="header-box">
        <div class="header-row">
          <button class="btn-back" type="button" (click)="volver()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </button>
          <div class="header-titles">
            <h2>Conversaciones</h2>
            <p>Mesas ocupadas ahora mismo</p>
          </div>
        </div>
      </div>

      <div class="consultas-body">
        @if (cargando()) {
          <div class="estado-carga">
            <img src="assets/icon/logo.png" alt="" class="spinner-logo spinner-logo--grande" />
            <span>Cargando mesas...</span>
          </div>
        } @else if (mesas().length === 0) {
          <div class="estado-vacio">
            <span>No hay mesas ocupadas en este momento.</span>
          </div>
        } @else {
          <div class="mesas-scroll">
            @for (mesa of mesas(); track mesa.id) {
              <button type="button" class="mesa-item" (click)="abrirMesa(mesa)">
                <div class="mesa-item__avatar">
                  <span>{{ mesa.numero }}</span>
                  <small>mesa</small>
                </div>

                <div class="mesa-item__texto">
                  <div class="mesa-item__linea-top">
                    <span class="mesa-item__nombre">
                      {{ previewDe(mesa)?.clienteNombre ?? ('Mesa ' + mesa.numero) }}
                      <span class="mesa-item__personas">· {{ mesa.capacidad }} personas</span>
                    </span>
                    @if (previewDe(mesa)?.ultimaFecha) {
                      <span class="mesa-item__hora">{{ previewDe(mesa)?.ultimaFecha | date:'dd/MM HH:mm' }}</span>
                    }
                  </div>
                  <div class="mesa-item__linea-bottom">
                    <span class="mesa-item__ultimo">
                      {{ previewDe(mesa)?.ultimoMensaje ?? 'Todavía no escribieron' }}
                    </span>
                    @if (tieneNovedad(mesa)) {
                      <span class="mesa-item__badge" aria-label="Mensaje nuevo sin leer"></span>
                    }
                  </div>
                </div>
              </button>
            }
          </div>
        }

        @if (mensajeError()) {
          <div class="feedback-banner error">
            <span>{{ mensajeError() }}</span>
          </div>
        }
      </div>
    </div>
  </div>
</div>
