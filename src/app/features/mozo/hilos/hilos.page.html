<div class="hilos-page-wrapper">
  <div class="main-container">
    <div class="card-box">
      <div class="header-box">
        <div class="header-row">
          <button class="btn-back" type="button" (click)="volver()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </button>
          <div class="header-titles">
            <h2>Mesa {{ mesa()?.numero }}</h2>
            <p>Conversaciones abiertas</p>
          </div>
        </div>
      </div>

      <div class="hilos-body">
        @if (cargando()) {
          <div class="estado-carga">
            <img src="assets/icon/logo.png" alt="" class="spinner-logo spinner-logo--grande" />
            <span>Cargando conversaciones...</span>
          </div>
        } @else if (hilos().length === 0) {
          <div class="estado-vacio">
            <img src="assets/icon/logo.png" alt="" class="vacio-logo" />
            <span class="vacio-texto">Todavía no hay ninguna consulta en esta mesa.</span>
          </div>
        } @else {
          <div class="hilos-scroll">
            @for (hilo of hilos(); track hilo.hiloClienteId) {
              <button type="button" class="hilo-item" (click)="abrirHilo(hilo)">
                <div class="hilo-item__avatar">{{ hilo.clienteNombre.charAt(0) }}</div>

                <div class="hilo-item__texto">
                  <div class="hilo-item__linea-top">
                    <span class="hilo-item__nombre">{{ hilo.clienteNombre }}</span>
                    <span class="hilo-item__hora">{{ hilo.ultimaFecha | date:'dd/MM HH:mm' }}</span>
                  </div>
                  <div class="hilo-item__linea-bottom">
                    <span class="hilo-item__ultimo">{{ hilo.ultimoMensaje }}</span>
                    @if (hilo.tieneNovedad) {
                      <span class="hilo-item__badge" aria-label="Mensaje nuevo sin leer"></span>
                    }
                  </div>
                </div>
              </button>
            }
          </div>
        }

        @if (mensajeError()) {
          <div class="feedback-banner error">
            <span>{{ mensajeError() }}</span>
          </div>
        }
      </div>
    </div>
  </div>
</div>
