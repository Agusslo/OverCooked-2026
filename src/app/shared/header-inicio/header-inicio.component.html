<header class="hi-header">
  <div class="hi-avatar">
    @if (fotoUrl) {
      <img [src]="fotoUrl" alt="Foto de perfil de {{ nombre }}" />
    } @else {
      <span>{{ iniciales }}</span>
    }
  </div>

  <div class="hi-identidad">
    <span class="hi-rol">{{ rolMostrado }}</span>
    <span class="hi-nombre">{{ nombre }}</span>
  </div>

  <button
    type="button"
    class="hi-logout"
    (click)="cerrarSesion()"
    aria-label="Cerrar sesión"
  >
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <path d="m16 17 5-5-5-5" />
      <path d="M21 12H9" />
    </svg>
  </button>
</header>
